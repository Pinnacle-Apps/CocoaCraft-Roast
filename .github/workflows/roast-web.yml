name: Roast software foundation
on:
  pull_request:
    paths: ['roast-web/**', 'tools/**', '.github/workflows/roast-web.yml']
  push:
    paths: ['roast-web/**', 'tools/**', '.github/workflows/roast-web.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: roast-web/requirements.txt
      - run: pip install -r roast-web/requirements-dev.txt
      - run: python -m unittest discover -s roast-web/tests -v
